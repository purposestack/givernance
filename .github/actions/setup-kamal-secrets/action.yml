name: Setup Kamal Secrets
description: >
  Build the `.kamal/secrets` file the staging deploy + accessory-reboot
  workflows hand to Kamal. Reads the resolved secret values from environment
  variables the caller workflow exports (so the GH `secrets.*` lookups stay
  scoped to the caller, which knows its `environment:`). Validates that
  `MINIO_KMS_SECRET_KEY` decodes to exactly 32 bytes — MinIO refuses to boot
  on any other length, and a bad fallback masquerading as a valid secret was
  the root cause of the 2026-04-29 staging incident (issue #211).

  Single source of truth for the secrets bag: deploy-staging.yml and
  staging-accessory-reboot.yml both `uses: ./.github/actions/setup-kamal-secrets`,
  so a future change to the bag (new var, rotation policy) lands in one place.

runs:
  using: composite
  steps:
    - name: Build .kamal/secrets and validate MINIO_KMS
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .kamal

        # Every secret below is required — `:?` aborts the step with a
        # clear error if the matching GH-Environment secret is unset
        # (issue #343). The previous `:-staging_X_123` fallbacks were a
        # foot-gun: they were committed in plaintext, framed as "non-
        # load-bearing", and turned out to be load-bearing on the
        # 2026-05-10 hygiene audit (#340). Now a missing secret fails
        # at deploy time with a clear pointer instead of silently
        # rebooting onto a known-public default.
        #
        # Adding a new caller (e.g. a future production environment, see
        # `docs/runbooks/launch-prod.md`)? Every name listed here must
        # exist in that environment's secret bag, generated via
        # `openssl rand -hex 24` (URL-safe by construction; #335 fix
        # makes other charsets work too but hex stays the recommendation).
        # Fork-developer setup steps live in `docs/dev/staging-secrets-setup.md`.
        PG_PASS="${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in Settings → Environments → staging → Secrets. See docs/dev/staging-secrets-setup.md.}"
        REDIS_PASS="${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in Settings → Environments → staging → Secrets. See docs/dev/staging-secrets-setup.md.}"
        MINIO_PASS="${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required — set it in Settings → Environments → staging → Secrets. See docs/dev/staging-secrets-setup.md.}"
        KC_PASS="${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required — set it in Settings → Environments → staging → Secrets. See docs/dev/staging-secrets-setup.md.}"
        KC_CLIENT_SECRET="${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required — set it in Settings → Environments → staging → Secrets. See docs/dev/staging-secrets-setup.md.}"
        SESSION_SEC="${SESSION_SECRET:?SESSION_SECRET is required — set it in Settings → Environments → staging → Secrets. See docs/dev/staging-secrets-setup.md.}"
        # Resend API key — required because deploy-staging.yml sets
        # EMAIL_PROVIDER=resend; missing key crashes the worker on first
        # send. No fallback: an unset secret here is a deploy bug.
        RESEND_KEY="${RESEND_API_KEY:-}"
        # Stripe — empty fallback intentionally surfaces the user-facing
        # "Stripe is not configured" message instead of silently no-op'ing
        # the route. Set via `gh secret set --env staging`
        # (see docs/dev/stripe-local-setup.md → Staging deployment).
        STRIPE_SECRET="${STRIPE_SECRET_KEY:-}"
        STRIPE_WEBHOOK_SEC="${STRIPE_WEBHOOK_SECRET:-}"
        # Impersonation JWT signing secret (issue #24). Production env
        # check in packages/api/src/env.ts requires this be present and
        # ≥32 chars — without it the api container exits 1 on boot, which
        # was the regression from 1e49f8e that took staging down on every
        # push to main.
        IMPERSONATION_JWT="${IMPERSONATION_JWT_SECRET:?IMPERSONATION_JWT_SECRET is required — set it in Settings → Environments → staging → Secrets. See docs/dev/staging-secrets-setup.md.}"
        # Keycloak's dedicated DB role password (ADR-017). Wired into:
        #   - the postgres accessory's init script on first cluster init
        #     (provisions the `keycloak` role + `givernance_keycloak` DB —
        #     `infra/postgres/init/01-init-keycloak-db.sh`).
        #   - the keycloak accessory after issue #283's blue-green cutover
        #     (`docs/runbooks/migrate-staging-keycloak-db.md`), when
        #     `KC_DB_USERNAME` flips from `givernance` (bootstrap superuser
        #     used by the legacy co-located KC) to `keycloak` (least-priv
        #     role owning only the KC DB).
        # After PR #336 cutover (2026-05-10), staging keycloak runs as
        # the dedicated `keycloak` role with this password.
        KEYCLOAK_DB_PASS="${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required — set it in Settings → Environments → staging → Secrets. See docs/dev/staging-secrets-setup.md.}"
        # Application-role password (issue #430). The application + worker
        # connect to Postgres as `givernance_app` (NOBYPASSRLS) so the
        # `users.tenant_isolation` RLS policy is enforced at the connection
        # level. The owner role `givernance` (BYPASSRLS) stays on
        # `DATABASE_URL` for migrations and legitimate cross-tenant work
        # (signup, webhook resolution, platform-admin tasks).
        #
        # Before the 2026-05-23 patch landed, `DATABASE_URL_APP` was
        # constructed with the owner role — `givernance_app` had no
        # password set anywhere in deploy config — and RLS was silently
        # bypassed across the entire stack.
        APP_PASS="${GIVERNANCE_APP_PASSWORD:?GIVERNANCE_APP_PASSWORD is required — set it in Settings → Environments → staging → Secrets (generate with 'openssl rand -hex 24'). See docs/dev/staging-secrets-setup.md.}"
        # MinIO server-side AES256 encryption key. Format
        # `<key-name>:<base64-32-byte-secret>`; generate with
        # `openssl rand -base64 32` and prefix with `<keyname>:`. The
        # base64 portion MUST decode to exactly 32 bytes — the validation
        # step below enforces this; the 2026-04-29 outage (#211) was
        # caused by a wrong-length value masquerading as valid.
        MINIO_KMS="${MINIO_KMS_SECRET_KEY:?MINIO_KMS_SECRET_KEY is required — set it in Settings → Environments → staging → Secrets. Format: <key-name>:<base64-32-byte-secret>. See docs/dev/staging-secrets-setup.md.}"

        KMS_BASE64="${MINIO_KMS#*:}"
        KMS_LEN=$(printf '%s' "$KMS_BASE64" | base64 -d 2>/dev/null | wc -c | tr -d ' ')
        if [ "$KMS_LEN" != "32" ]; then
          echo "::error::MINIO_KMS_SECRET_KEY base64 portion decodes to $KMS_LEN bytes, MinIO requires exactly 32. Regenerate with 'openssl rand -base64 32' and update the GH secret (or the fallback in this action)." >&2
          exit 1
        fi

        # URL-encode passwords before interpolating them into URIs (issue #335).
        # `pg-connection-string` (used by drizzle-kit AND `pg.Pool`) and
        # `ioredis` parse the URI strictly: any `/`, `?`, `#`, `@`, `:`, `+`,
        # `=`, `[`, `]` in the password segment splits the URL at the wrong
        # boundary. Discovered the hard way during the issue #283 staging
        # cutover when `openssl rand -base64 24` produced a `/`-containing
        # POSTGRES_PASSWORD and drizzle-kit migrate exit 1'd silently with
        # `applying migrations…` (the underlying `TypeError: Invalid URL`
        # got swallowed). `jq -sRr @uri` is RFC 3986 percent-encoding;
        # available on every GH Actions runner via the standard image.
        PG_PASS_ENC=$(printf '%s' "$PG_PASS" | jq -sRr @uri)
        APP_PASS_ENC=$(printf '%s' "$APP_PASS" | jq -sRr @uri)
        REDIS_PASS_ENC=$(printf '%s' "$REDIS_PASS" | jq -sRr @uri)

        cat <<EOF > .kamal/secrets
        GITHUB_TOKEN=${GITHUB_TOKEN}
        POSTGRES_PASSWORD=$PG_PASS
        REDIS_PASSWORD=$REDIS_PASS
        MINIO_ROOT_PASSWORD=$MINIO_PASS
        MINIO_KMS_SECRET_KEY=$MINIO_KMS
        KEYCLOAK_ADMIN_PASSWORD=$KC_PASS
        SESSION_SECRET=$SESSION_SEC
        KC_DB_PASSWORD=$KEYCLOAK_DB_PASS
        DATABASE_URL=postgres://givernance:$PG_PASS_ENC@givernance-postgres:5432/givernance_staging
        DATABASE_URL_APP=postgres://givernance_app:$APP_PASS_ENC@givernance-postgres:5432/givernance_staging
        GIVERNANCE_APP_PASSWORD=$APP_PASS
        REDIS_URL=redis://:$REDIS_PASS_ENC@givernance-redis:6379
        S3_SECRET_ACCESS_KEY=$MINIO_PASS
        KEYCLOAK_ADMIN_CLIENT_SECRET=$KC_CLIENT_SECRET
        RESEND_API_KEY=$RESEND_KEY
        STRIPE_SECRET_KEY=$STRIPE_SECRET
        STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SEC
        IMPERSONATION_JWT_SECRET=$IMPERSONATION_JWT
        KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASS
        EOF
