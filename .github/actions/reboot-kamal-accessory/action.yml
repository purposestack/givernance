name: Reboot Kamal Accessory
description: >
  Reboot a Kamal accessory and dump its container logs on failure.
  Single source of truth for the reboot procedure: deploy-staging.yml
  invokes it after a kamal deploy when accessory config changed (so
  port-mapping / image-bump / env edits actually take effect on the
  running container — `kamal setup` is a noop on already-running
  accessories), and staging-accessory-reboot.yml invokes it for
  out-of-band secret rotations (MINIO_KMS_SECRET_KEY etc) where no
  file changed but the running env is now stale.

  Caller responsibilities (must run before this action): the SSH agent
  is configured against the staging VPS, ruby + kamal are installed,
  and `.kamal/secrets` is on disk. The two callers both get there via
  the same setup-kamal-secrets composite action.

inputs:
  accessory:
    description: Accessory name, must match `accessories.<name>` in the kamal config.
    required: true
  config:
    description: Path to the kamal config file.
    required: false
    default: config/deploy-staging.yml

runs:
  using: composite
  steps:
    # Refresh the GHCR login on the host before pulling. Two reasons:
    #   - The token stored in /root/.docker/config.json from a previous
    #     `kamal setup` can become stale or be overwritten by ad-hoc
    #     operator logins. A `kamal deploy` does NOT re-run registry
    #     login, so without this step a single accidental
    #     `docker login` on the VPS leaves the host unable to pull
    #     until the next `kamal setup`.
    #   - The runner's job has `packages: write` on the auto-issued
    #     GITHUB_TOKEN, so this always re-establishes good creds via
    #     `registry:` in the kamal config (server: ghcr.io,
    #     password: GITHUB_TOKEN).
    - name: Refresh registry login on host
      shell: bash
      run: bundle exec kamal registry login -c "${{ inputs.config }}"

    # `kamal accessory boot` runs plain `docker run` on the host without
    # `--pull=always`, so a fresh image pushed to GHCR earlier in this
    # job is ignored if the host has the same tag locally cached. That
    # produced a silent regression on 2026-05-13 where the Keycloak
    # theme rebuild succeeded in CI, the container was recreated, but
    # the running image was the prior-day's cached `:latest`. Force a
    # pull before the boot so the reboot step is self-healing for image
    # bumps that reuse a tag (`:latest`, `:staging`).
    #
    # NOTE: the kamal subcommand is `pull_image` (not `pull`) — kamal 2.x
    # exposes the accessory pull verb under that name; see
    # https://github.com/basecamp/kamal/blob/v2.11.0/lib/kamal/cli/accessory.rb
    # PR #368 originally shipped this as `pull` and broke the staging
    # deploy with "Could not find command pull".
    - name: Pull latest accessory image on host
      shell: bash
      run: bundle exec kamal accessory pull_image "${{ inputs.accessory }}" -c "${{ inputs.config }}"

    # `kamal accessory reboot` issues `kamal-proxy remove <service>`
    # unconditionally, which fails with "Error: service not found" the
    # first time a `proxy:` block is added to an existing accessory —
    # leaving the accessory container stopped and the deploy red
    # (2026-05-12 incident, MinIO on staging). Drive the sequence
    # manually instead: tolerantly clear any prior proxy registration
    # and the existing container (host-mounted volumes preserve data),
    # then `accessory boot` to create the container fresh and register
    # the proxy. Idempotent for both first-time proxy registration AND
    # subsequent reboots, so callers don't need to special-case.
    - name: Reboot accessory
      id: reboot
      shell: bash
      run: |
        set -euo pipefail
        ACC="${{ inputs.accessory }}"
        CFG="${{ inputs.config }}"
        bundle exec kamal server exec -c "$CFG" \
          "docker exec kamal-proxy kamal-proxy remove givernance-${ACC} >/dev/null 2>&1 || true; \
           docker container rm -f givernance-${ACC} >/dev/null 2>&1 || true"
        bundle exec kamal accessory boot "$ACC" -c "$CFG"

    # Scoped to "the reboot itself failed" rather than `if: failure()`,
    # which would also fire on any earlier failure in the parent job and
    # produce confusing logs from an accessory we never tried to touch.
    - name: Dump accessory logs on reboot failure
      if: steps.reboot.conclusion == 'failure'
      shell: bash
      run: |
        bundle exec kamal server exec -c "${{ inputs.config }}" \
          "docker logs givernance-${{ inputs.accessory }} --tail 100" || true
