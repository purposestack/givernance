name: _Capture Staging Logs (temporary)

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "grep pattern (optional)"
        required: false
        default: ""

jobs:
  logs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STAGING_VPS_IP: ${{ secrets.STAGING_VPS_IP }}
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Web logs (last 200 lines)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.STAGING_VPS_IP }} \
            "docker ps --filter name=givernance-web -q | head -n 1 | xargs -I {} docker logs --tail 200 {}" 2>&1 || true

      - name: API logs (last 300 lines)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.STAGING_VPS_IP }} \
            "docker ps --filter name=givernance-api -q | head -n 1 | xargs -I {} docker logs --tail 300 {}" 2>&1 || true

      - name: Search for error id (if provided)
        if: ${{ inputs.grep != '' }}
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.STAGING_VPS_IP }} \
            "docker ps --filter name=givernance- -q | xargs -I {} docker logs {} 2>&1 | grep -i '${{ inputs.grep }}' | tail -n 100" 2>&1 || true
