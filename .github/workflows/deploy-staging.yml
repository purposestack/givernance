name: Deploy to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Scoping the job to the `staging` GitHub Environment lets us keep
    # env-specific secrets (VPS_IP, SSH_PRIVATE_KEY, RESEND_API_KEY) out
    # of the repo-wide bag and use unprefixed names that will line up
    # cleanly when a future `production` environment gets added.
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      # Kamal config (config/deploy-staging.yml) reads STAGING_VPS_IP from
      # the runner env — keep the env var name; only the secret source moved
      # into the `staging` environment.
      STAGING_VPS_IP: ${{ secrets.VPS_IP }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby (for Kamal)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal

      - name: Configure SSH Auth Sock
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Kamal Secrets
        run: |
          mkdir -p .kamal
          PG_PASS="${{ secrets.POSTGRES_PASSWORD || 'staging_postgres_123' }}"
          REDIS_PASS="${{ secrets.REDIS_PASSWORD || 'staging_redis_123' }}"
          MINIO_PASS="${{ secrets.MINIO_ROOT_PASSWORD || 'staging_minio_123' }}"
          KC_PASS="${{ secrets.KEYCLOAK_ADMIN_PASSWORD || 'staging_keycloak_123' }}"
          KC_CLIENT_SECRET="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET || 'staging_keycloak_client_secret_123' }}"
          SESSION_SEC="${{ secrets.SESSION_SECRET || 'staging_session_secret_123' }}"
          # Resend API key — required because deploy-staging.yml sets
          # EMAIL_PROVIDER=resend; missing key crashes the worker on first
          # send. No fallback: an unset secret here is a deploy bug.
          RESEND_KEY="${{ secrets.RESEND_API_KEY }}"

          cat <<EOF > .kamal/secrets
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD=$PG_PASS
          REDIS_PASSWORD=$REDIS_PASS
          MINIO_ROOT_PASSWORD=$MINIO_PASS
          KEYCLOAK_ADMIN_PASSWORD=$KC_PASS
          SESSION_SECRET=$SESSION_SEC
          KC_DB_PASSWORD=$PG_PASS
          DATABASE_URL=postgres://givernance:$PG_PASS@givernance-postgres:5432/givernance_staging
          DATABASE_URL_APP=postgres://givernance:$PG_PASS@givernance-postgres:5432/givernance_staging
          REDIS_URL=redis://:$REDIS_PASS@givernance-redis:6379
          S3_SECRET_ACCESS_KEY=$MINIO_PASS
          KEYCLOAK_ADMIN_CLIENT_SECRET=$KC_CLIENT_SECRET
          RESEND_API_KEY=$RESEND_KEY
          EOF

      - name: Build and push Keycloak image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            -t ghcr.io/purposestack/givernance-keycloak:latest \
            -f infra/keycloak/Dockerfile \
            infra/keycloak/
          docker push ghcr.io/purposestack/givernance-keycloak:latest

      - name: Release Deploy Lock
        run: kamal lock release -c config/deploy-staging.yml || true

      - name: Deploy with Kamal
        run: |
          attempt=1
          max_attempts=3
          until kamal setup -c config/deploy-staging.yml; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "kamal setup failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "kamal setup failed (attempt $attempt/$max_attempts) — releasing lock and retrying"
            kamal lock release -c config/deploy-staging.yml || true
            attempt=$((attempt + 1))
            sleep 5
          done

      # The realm JSON is mounted into the keycloak accessory via Kamal's `files:`.
      # Rebooting the accessory re-copies the file and triggers a re-import under
      # KC_IMPORT_STRATEGY=OVERWRITE_EXISTING (set in config/deploy-staging.yml).
      - name: Reboot Keycloak to re-import realm JSON
        run: kamal accessory reboot keycloak -c config/deploy-staging.yml

      - name: Wait for Keycloak realm to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://auth.staging.givernance.org/realms/givernance/.well-known/openid-configuration || true)
            if [ "$code" = "200" ]; then
              echo "Realm 'givernance' is ready."
              exit 0
            fi
            echo "Waiting for realm 'givernance' (attempt $i/60, http=$code)..."
            sleep 5
          done
          echo "Timed out waiting for realm 'givernance'." >&2
          exit 1

      - name: Run DB Migrations
        run: kamal app exec -c config/deploy-staging.yml --reuse "pnpm --filter @givernance/api run db:migrate"

      - name: Run DB Seed
        run: kamal app exec -c config/deploy-staging.yml --reuse "pnpm --filter @givernance/api run db:seed"

      # The sync script reconciles the live realm (mappers, scopes, role
      # assignments) against the source-of-truth in scripts/keycloak-sync-realm.sh.
      # Run it from the runner against the public Admin URL — bash/curl/python3
      # are all native to ubuntu-latest, so we don't have to ship them in the
      # production image just to satisfy `kamal app exec`.
      - name: Sync Keycloak realm
        env:
          KEYCLOAK_URL: https://auth.staging.givernance.org
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD || 'staging_keycloak_123' }}
          # Source-of-truth for the `givernance-admin` client secret. The
          # sync script rotates the imported placeholder so Admin API calls
          # from the backend authenticate cleanly. Same value Kamal injects
          # into the API container.
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET || 'staging_keycloak_client_secret_123' }}
        run: bash scripts/keycloak-sync-realm.sh

      - name: Dump Keycloak logs on failure
        if: failure()
        run: |
          kamal server exec -c config/deploy-staging.yml \
            "docker logs givernance-keycloak --tail 200" || true

      - name: Dump API logs on failure
        if: failure()
        run: |
          kamal server exec -c config/deploy-staging.yml \
            "docker ps -a --filter name=givernance-api -q | head -n 1 | xargs -I {} docker logs --tail 200 {}" || true
