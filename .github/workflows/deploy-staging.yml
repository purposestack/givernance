name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: |
          Kamal command override. `auto` (default) inspects the diff — if
          `config/deploy-staging.yml` changed (accessories, proxy, env,
          builder), runs `kamal setup`; otherwise runs `kamal deploy`.
          Pick `setup` to force a full bootstrap, or `deploy` to skip
          bootstrap even if config changed (only if you're sure the
          change has no accessory side-effects).
        type: choice
        options:
          - auto
          - deploy
          - setup
        default: auto
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Scoping the job to the `staging` GitHub Environment lets us keep
    # env-specific secrets (VPS_IP, SSH_PRIVATE_KEY, RESEND_API_KEY) out
    # of the repo-wide bag and use unprefixed names that will line up
    # cleanly when a future `production` environment gets added.
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      # Kamal config (config/deploy-staging.yml) reads STAGING_VPS_IP from
      # the runner env — keep the env var name; only the secret source moved
      # into the `staging` environment.
      STAGING_VPS_IP: ${{ secrets.VPS_IP }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Exported here (not just in the secrets-write step below) so the
      # ERB template in `config/deploy-staging.yml` resolves it at
      # `kamal setup` time. `NEXT_PUBLIC_*` is baked into the Next.js
      # bundle at Docker build via `builder.args` — runtime env injection
      # cannot reach it. Empty fallback keeps the deploy from blocking on
      # a missing secret; the donor flow surfaces a clear "Stripe is not
      # configured" message instead.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      # Detect whether this push touched Keycloak source files (the realm
      # JSON, the sync script) — combined with `gates.outputs.keycloak_changed`
      # below to drive the slow chain (image build → reboot → realm-ready
      # wait → realm sync, ~85s combined). On workflow_dispatch we always
      # run the chain so a manual button-click means "full deploy" by
      # default. paths-filter uses the GitHub API and works with default
      # (shallow) checkouts.
      #
      # `.github/workflows/deploy-staging.yml` is intentionally NOT in the
      # `keycloak` filter — workflow tweaks (comment edits, runner bumps,
      # editing this filter list) shouldn't trigger the ~85s Keycloak chain.
      # Real Keycloak-relevant changes are caught either by `infra/keycloak/**`
      # / the sync script (here) or by `gates.outputs.keycloak_changed`
      # (when `accessories.keycloak` in `config/deploy-staging.yml`
      # changes — image bumps, env tweaks).
      #
      # Pinned to a commit SHA per @Onigam's review — the workflow runs
      # with `packages: write`, so a third-party action gets a SHA pin
      # instead of a moving tag. SHA below is `dorny/paths-filter@v4`
      # at 2026-05-04; bump intentionally when upgrading.
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            keycloak:
              - 'infra/keycloak/**'
              - 'scripts/keycloak-sync-realm.sh'
            kamal_config:
              - 'config/deploy-staging.yml'

      # Per-accessory subtree diff of `config/deploy-staging.yml`. The
      # file-level `kamal_config` filter above tells us "the file was
      # edited"; this step tells us, for each `accessories.<name>`
      # subtree, whether *that* subtree moved — so we only reboot the
      # accessories whose config actually changed instead of every
      # accessory whenever the file is touched (e.g., a top-level
      # `env.clear` edit).
      #
      # The list of accessories is derived from
      # `yq '.accessories | keys'` so adding a new accessory in
      # `config/deploy-staging.yml` automatically gets per-subtree
      # diffing here — no edit to this workflow required (issue #322).
      #
      # Outputs:
      #   <acc>_changed         — `accessories.<acc>` subtree differs vs BEFORE_SHA
      #                           (one output per accessory key)
      #   run_keycloak          — combined gate for the Keycloak chain
      #                           (file-paths OR subtree OR workflow_dispatch)
      #   accessories_to_reboot — space-separated list of non-keycloak
      #                           accessories needing a reboot. Keycloak is
      #                           omitted because it has its own dedicated
      #                           reboot step (it gates the realm-import
      #                           chain and must run before the realm-ready
      #                           wait); the Keycloak reboot keys off
      #                           `run_keycloak` instead.
      #
      # Conservative on edge cases: workflow_dispatch (no diff base) and
      # missing-parent (force push, first push to a new branch) both
      # treat every accessory as changed. False positive cost is one
      # extra ~30-60s reboot on a rare push; false negative cost is a
      # silently-skipped config sync, which we won't accept.
      - name: Detect per-accessory config changes & compute gates
        id: gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          KAMAL_CONFIG_CHANGED: ${{ steps.changes.outputs.kamal_config }}
          KEYCLOAK_FILES_CHANGED: ${{ steps.changes.outputs.keycloak }}
        run: |
          set -euo pipefail

          ACCESSORIES=$(yq -r '.accessories | keys | .[]' config/deploy-staging.yml)
          if [ -z "$ACCESSORIES" ]; then
            echo "::error::No accessories found under .accessories in config/deploy-staging.yml" >&2
            exit 1
          fi
          echo "Detected accessories: $(echo "$ACCESSORIES" | tr '\n' ' ')"

          declare -A ACC_CHANGED
          for acc in $ACCESSORIES; do
            ACC_CHANGED[$acc]=false
          done

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            for acc in $ACCESSORIES; do
              ACC_CHANGED[$acc]=true
            done
          elif [ "$KAMAL_CONFIG_CHANGED" = "true" ]; then
            OLD=$(mktemp)
            if git show "${BEFORE_SHA}:config/deploy-staging.yml" > "$OLD" 2>/dev/null; then
              for acc in $ACCESSORIES; do
                OLD_HASH=$(yq ".accessories.${acc}" "$OLD" 2>/dev/null | sha256sum | cut -d' ' -f1)
                NEW_HASH=$(yq ".accessories.${acc}" config/deploy-staging.yml 2>/dev/null | sha256sum | cut -d' ' -f1)
                if [ "$OLD_HASH" != "$NEW_HASH" ]; then
                  ACC_CHANGED[$acc]=true
                  echo "accessories.${acc} subtree changed"
                fi
              done
              rm -f "$OLD"
            else
              # Force push, first-push to branch, or BEFORE_SHA gone — be conservative.
              for acc in $ACCESSORIES; do
                ACC_CHANGED[$acc]=true
              done
              echo "BEFORE_SHA=${BEFORE_SHA} unavailable — assuming all accessory subtrees changed"
            fi
          fi

          # Keycloak chain gate: paths-filter on infra/keycloak/** OR the
          # accessory subtree changed OR a manual dispatch.
          keycloak_changed=${ACC_CHANGED[keycloak]:-false}
          run_keycloak=false
          if [ "$KEYCLOAK_FILES_CHANGED" = "true" ] || [ "$keycloak_changed" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_keycloak=true
          fi

          # Build the reboot list for non-keycloak accessories. Keycloak
          # has its own gated reboot step (must run before realm-ready
          # wait + realm sync) so we exclude it here to avoid a double
          # reboot on the same deploy.
          accessories_to_reboot=""
          for acc in $ACCESSORIES; do
            if [ "$acc" = "keycloak" ]; then
              continue
            fi
            if [ "${ACC_CHANGED[$acc]}" = "true" ]; then
              accessories_to_reboot="${accessories_to_reboot}${accessories_to_reboot:+ }${acc}"
            fi
          done

          {
            for acc in $ACCESSORIES; do
              echo "${acc}_changed=${ACC_CHANGED[$acc]}"
            done
            echo "run_keycloak=${run_keycloak}"
            echo "accessories_to_reboot=${accessories_to_reboot}"
          } >> "$GITHUB_OUTPUT"

          echo "::group::Computed deploy gates"
          echo "  keycloak files changed (paths-filter):    ${KEYCLOAK_FILES_CHANGED}"
          for acc in $ACCESSORIES; do
            printf '  accessories.%-9s subtree changed:    %s\n' "$acc" "${ACC_CHANGED[$acc]}"
          done
          echo "  → run_keycloak (chain):                   ${run_keycloak}"
          echo "  → accessories_to_reboot:                  '${accessories_to_reboot}'"
          echo "::endgroup::"

      # `bundler-cache: true` reads `Gemfile.lock` at the repo root and
      # caches `vendor/bundle` keyed on that file's hash, so a no-Gemfile-
      # change push reuses the previous run's installed gems instead of
      # paying ~10-15s for `gem install kamal`. Cache hit/miss is logged
      # by the action.
      - name: Set up Ruby (for Kamal)
        uses: ruby/setup-ruby@v1.316.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Pinned to a commit SHA — this action receives `SSH_PRIVATE_KEY`
      # and the surrounding job handles other secrets (`POSTGRES_PASSWORD`,
      # `REDIS_PASSWORD`, `SEAWEEDFS_S3_SECRET_KEY`), so a third-party action
      # gets a SHA pin instead of a moving tag. SHA below is
      # `webfactory/ssh-agent@v0.10.0` at 2026-05-10; bump intentionally
      # when upgrading.
      - name: Configure SSH Auth Sock
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Resolve every secret via `staging` env first (with fallbacks for
      # non-load-bearing values) and hand them to the composite action,
      # which writes `.kamal/secrets` and renders the SeaweedFS s3config.
      # Same setup is reused by .github/workflows/staging-accessory-reboot.yml.
      - name: Setup Kamal Secrets
        uses: ./.github/actions/setup-kamal-secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SEAWEEDFS_S3_SECRET_KEY: ${{ secrets.SEAWEEDFS_S3_SECRET_KEY }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SEAWEEDFS_SSE_KEY: ${{ secrets.SEAWEEDFS_SSE_KEY }}
          IMPERSONATION_JWT_SECRET: ${{ secrets.IMPERSONATION_JWT_SECRET }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          GIVERNANCE_APP_PASSWORD: ${{ secrets.GIVERNANCE_APP_PASSWORD }}

      - name: Build and push Keycloak image
        if: steps.gates.outputs.run_keycloak == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            -t ghcr.io/purposestack/givernance-keycloak:latest \
            -f infra/keycloak/Dockerfile \
            infra/keycloak/
          docker push ghcr.io/purposestack/givernance-keycloak:latest

      - name: Release Deploy Lock
        run: bundle exec kamal lock release -c config/deploy-staging.yml || true

      # Per-push runs use `kamal deploy` (only rolls app containers) — `setup`
      # additionally re-installs Docker, recreates the kamal network, and
      # re-registers every accessory, all of which is wasted work on an
      # already-bootstrapped VPS. We auto-fall-back to `setup` whenever
      # `config/deploy-staging.yml` is modified, so accessory edits land
      # on the VPS without anyone having to remember to flip a switch.
      # Manual override available via the `mode` workflow_dispatch input.
      - name: Resolve Kamal command
        id: kamal_cmd
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'auto' }}
          KAMAL_CONFIG_CHANGED: ${{ steps.changes.outputs.kamal_config }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$INPUT_MODE" = "setup" ] || [ "$INPUT_MODE" = "deploy" ]; then
            CMD="$INPUT_MODE"
            echo "Manual override (workflow_dispatch mode=$INPUT_MODE) — running kamal $CMD"
          elif [ "$KAMAL_CONFIG_CHANGED" = "true" ]; then
            CMD="setup"
            echo "config/deploy-staging.yml changed in this push — running kamal setup (full bootstrap, accessory-safe)"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual trigger + mode=auto: paths-filter has no reliable diff
            # to compare against (no parent push), so default to the safe
            # full-bootstrap path. Mirrors the keycloak-chain default.
            CMD="setup"
            echo "Manual trigger with mode=auto — defaulting to kamal setup"
          else
            CMD="deploy"
            echo "Routine push, no config change — running kamal deploy (fast path)"
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Deploy with Kamal
        env:
          KAMAL_CMD: ${{ steps.kamal_cmd.outputs.cmd }}
        run: |
          attempt=1
          max_attempts=3
          until bundle exec kamal "$KAMAL_CMD" -c config/deploy-staging.yml; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "kamal $KAMAL_CMD failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "kamal $KAMAL_CMD failed (attempt $attempt/$max_attempts) — releasing lock and retrying"
            bundle exec kamal lock release -c config/deploy-staging.yml || true
            attempt=$((attempt + 1))
            sleep 5
          done

      # The realm JSON is mounted into the keycloak accessory via Kamal's `files:`.
      # Rebooting the accessory re-copies the file and triggers a re-import under
      # KC_IMPORT_STRATEGY=OVERWRITE_EXISTING (set in config/deploy-staging.yml).
      # Reboot procedure shared with staging-accessory-reboot.yml via the
      # composite action.
      - name: Reboot Keycloak to re-import realm JSON
        if: steps.gates.outputs.run_keycloak == 'true'
        uses: ./.github/actions/reboot-kamal-accessory
        with:
          accessory: keycloak

      # `kamal setup` only re-creates accessories that aren't already
      # running, so accessory-config changes (port mappings, image bumps,
      # env edits) on an existing instance are silent no-ops. Reboot
      # every non-keycloak accessory whose `accessories.<name>` subtree
      # actually moved in `config/deploy-staging.yml`, so those edits
      # land on the running container without anyone having to remember
      # to dispatch staging-accessory-reboot.yml — issue #214 dropped
      # the public `port: 9000` mapping for the object store and would have only
      # landed on a fresh VPS otherwise; PR #321 hit the same trap with
      # the redis 7→8 image bump (issue #322).
      #
      # The accessory list is derived from the `Detect per-accessory…`
      # step above, so adding a new accessory in the kamal config is
      # auto-covered. Keycloak is handled by its own dedicated reboot
      # step (it gates the realm-import chain — must run before the
      # realm-ready wait); skipping it here avoids a double-reboot.
      #
      # A typical no-config push leaves `accessories_to_reboot` empty
      # and the step is skipped; a single-accessory edit pays one
      # ~30-60s reboot. Out-of-band secret rotations (WEED_S3_SSE_KEY
      # etc) still use staging-accessory-reboot.yml — no file changed
      # so paths-filter doesn't fire here.
      #
      # Inlines the reboot procedure (vs. the composite action used by
      # staging-accessory-reboot.yml) because GH Actions can't call a
      # `uses:` step inside a shell loop. The two paths must stay in
      # sync — match `bundle exec kamal accessory reboot` and the
      # `docker logs givernance-<name>` log dump on failure.
      - name: Reboot accessories with config changes
        if: steps.gates.outputs.accessories_to_reboot != ''
        env:
          ACCESSORIES_TO_REBOOT: ${{ steps.gates.outputs.accessories_to_reboot }}
        run: |
          set -euo pipefail
          for acc in $ACCESSORIES_TO_REBOOT; do
            echo "::group::Reboot accessory: $acc"
            # `kamal accessory reboot` issues `kamal-proxy remove`
            # unconditionally, which fails with "service not found" the
            # first time a `proxy:` block is added to an accessory —
            # the 2026-05-12 object-store-accessory incident. Drive the sequence
            # manually; idempotent for both first-time proxy
            # registration and subsequent reboots. Mirrors the
            # composite action at
            # .github/actions/reboot-kamal-accessory/action.yml —
            # keep these two in sync.
            bundle exec kamal server exec -c config/deploy-staging.yml \
              "docker exec kamal-proxy kamal-proxy remove givernance-${acc} >/dev/null 2>&1 || true; \
               docker container rm -f givernance-${acc} >/dev/null 2>&1 || true"
            if ! bundle exec kamal accessory boot "$acc" -c config/deploy-staging.yml; then
              echo "::error::kamal accessory boot $acc failed; dumping last 100 log lines"
              bundle exec kamal server exec -c config/deploy-staging.yml \
                "docker logs givernance-${acc} --tail 100" || true
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Wait for Keycloak realm to be ready
        if: steps.gates.outputs.run_keycloak == 'true'
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://auth.staging.givernance.org/realms/givernance/.well-known/openid-configuration || true)
            if [ "$code" = "200" ]; then
              echo "Realm 'givernance' is ready."
              exit 0
            fi
            echo "Waiting for realm 'givernance' (attempt $i/60, http=$code)..."
            sleep 5
          done
          echo "Timed out waiting for realm 'givernance'." >&2
          exit 1

      - name: Run DB Migrations
        run: bundle exec kamal app exec -c config/deploy-staging.yml --reuse "pnpm --filter @givernance/api run db:migrate"

      - name: Run DB Seed
        run: bundle exec kamal app exec -c config/deploy-staging.yml --reuse "pnpm --filter @givernance/api run db:seed"

      # Ensure the SeaweedFS buckets the worker writes to exist + carry their
      # lifecycle (ADR-034 — replaces the MinIO `mc` provisioning). SeaweedFS
      # auto-creates a bucket on first PutObject, but the lifecycle expiry
      # rules (90d bulk-imports, 365d reports, 1d abort-incomplete-multipart)
      # MUST be applied explicitly via the S3 API — there is no `weed shell`
      # expiry command. Idempotent (create-bucket tolerates existing, lifecycle
      # is a PUT). Runs on the staging VPS via `kamal server exec`, against the
      # `kamal` Docker network where the seaweedfs accessory lives.
      #
      # Public-read for `branding` is NOT set here — it is the static
      # `anonymous Read:branding` identity in the mounted s3config.json
      # (ADR-023), so every other bucket denies anonymous reads structurally.
      # The aws-cli image is the same S3 client used everywhere; the inner
      # script is the repo's infra/seaweedfs/init.sh, kept in lockstep.
      - name: Ensure SeaweedFS buckets exist
        timeout-minutes: 5
        env:
          SEAWEEDFS_S3_SECRET_KEY: ${{ secrets.SEAWEEDFS_S3_SECRET_KEY }}
          S3_RECEIPTS_BUCKET: ${{ secrets.S3_RECEIPTS_BUCKET || 'receipts' }}
          S3_CAMPAIGNS_BUCKET: ${{ secrets.S3_CAMPAIGNS_BUCKET || 'campaigns' }}
          S3_BRANDING_BUCKET: ${{ secrets.S3_BRANDING_BUCKET || 'branding' }}
          S3_BULK_IMPORT_BUCKET: ${{ secrets.S3_BULK_IMPORT_BUCKET || 'bulk-imports' }}
          S3_REPORTS_BUCKET: ${{ secrets.S3_REPORTS_BUCKET || 'reports' }}
        run: |
          # `--entrypoint sh … -s` runs infra/seaweedfs/init.sh (which lives in
          # the repo, not on the VPS) inside the aws-cli container on the `kamal`
          # network.
          #
          # The script is base64-embedded INTO the remote command — NOT piped via
          # `kamal server exec … < init.sh`. SSHKit does NOT forward the local
          # process's stdin to the remote command, so the `< file` redirect was
          # silently dropped and the remote `sh -s` blocked forever on an empty
          # stdin — the 2026-06-06 deploy hang (no logs, no `aws` child, `sh -s`
          # waiting to read its script; see the cutover runbook post-mortem).
          # With the base64 form, `echo … | base64 -d | docker run -i … sh -s`
          # is a real pipe ON THE VPS, so the script actually reaches the
          # container's stdin. `base64 -w0` (single line, base64 alphabet has no
          # quotes) is safe inside the double-quoted REMOTE_CMD. The step also
          # carries `timeout-minutes` so any future stdin/readiness hang fails
          # fast instead of running until the job-level timeout.
          #
          # NOTE: the secret is interpolated into `REMOTE_CMD` and therefore
          # lands on the VPS `docker run -e S3_SECRET_ACCESS_KEY='…'` argv —
          # briefly visible via `ps aux`/`/proc` to a local user for the
          # seconds the init container runs. Accepted: the staging VPS is
          # single-tenant + operator-controlled, the window is seconds, and GH
          # masks the value in the Actions log (it travels over SSH, not the
          # runner log). Harden to an `--env-file` (umask 077, rm-after) if the
          # VPS ever becomes multi-tenant.
          SCRIPT_B64="$(base64 -w0 infra/seaweedfs/init.sh)"
          REMOTE_CMD="echo '${SCRIPT_B64}' | base64 -d | docker run --rm -i --network kamal \
            -e S3_ENDPOINT='http://givernance-seaweedfs:8333' \
            -e S3_ACCESS_KEY_ID='admin' \
            -e S3_SECRET_ACCESS_KEY='${SEAWEEDFS_S3_SECRET_KEY}' \
            -e S3_REGION='fr-par' \
            -e S3_RECEIPTS_BUCKET='${S3_RECEIPTS_BUCKET}' \
            -e S3_CAMPAIGNS_BUCKET='${S3_CAMPAIGNS_BUCKET}' \
            -e S3_BRANDING_BUCKET='${S3_BRANDING_BUCKET}' \
            -e S3_BULK_IMPORT_BUCKET='${S3_BULK_IMPORT_BUCKET}' \
            -e S3_REPORTS_BUCKET='${S3_REPORTS_BUCKET}' \
            --entrypoint sh amazon/aws-cli:latest -s"
          bundle exec kamal server exec -c config/deploy-staging.yml "$REMOTE_CMD"

      # The sync script reconciles the live realm (mappers, scopes, role
      # assignments) against the source-of-truth in scripts/keycloak-sync-realm.sh.
      # Run it from the runner against the public Admin URL — bash/curl/python3
      # are all native to ubuntu-latest, so we don't have to ship them in the
      # production image just to satisfy `kamal app exec`.
      - name: Sync Keycloak realm
        if: steps.gates.outputs.run_keycloak == 'true'
        env:
          KEYCLOAK_URL: https://auth.staging.givernance.org
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD || 'staging_keycloak_123' }}
          # Source-of-truth for the `givernance-admin` client secret. The
          # sync script rotates the imported placeholder so Admin API calls
          # from the backend authenticate cleanly. Same value Kamal injects
          # into the API container.
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET || 'staging_keycloak_client_secret_123' }}
          # SMTP — Keycloak sends password-reset emails via Resend's SMTP relay.
          # Reuses the same API key as the app worker (issue #190) so the
          # secret surface stays small. KC_SMTP_PASSWORD is a GitHub secret.
          KC_SMTP_HOST: smtp.resend.com
          KC_SMTP_PORT: "587"
          KC_SMTP_FROM: "noreply@givernance.org"
          KC_SMTP_FROM_DISPLAY_NAME: "Givernance"
          KC_SMTP_STARTTLS: "true"
          KC_SMTP_AUTH: "true"
          KC_SMTP_USERNAME: resend
          KC_SMTP_PASSWORD: ${{ secrets.RESEND_API_KEY }}
          # TOTP QR issuer label (issue #250 / PR #251 user feedback).
          # Authenticator apps render this as the account header so an
          # operator with credentials in multiple environments can tell
          # them apart at a glance — staging credentials show
          # "givernance-staging: <email>". Production deploys (when
          # they ship) should set the bare "givernance".
          KC_REALM_DISPLAY_NAME: givernance-staging
        run: bash scripts/keycloak-sync-realm.sh

      - name: Dump Keycloak logs on failure
        if: failure()
        run: |
          bundle exec kamal server exec -c config/deploy-staging.yml \
            "docker logs givernance-keycloak --tail 200" || true

      - name: Dump API logs on failure
        if: failure()
        run: |
          bundle exec kamal server exec -c config/deploy-staging.yml \
