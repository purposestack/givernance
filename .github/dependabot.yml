version: 2

# Security PRs must always open individually so a CVE never gets batched with
# cosmetic minor/patch bumps and lost in the weekly grouped PR. The
# `applies-to: version-updates` key on every group confines grouping to the
# routine update flow and excludes Dependabot security updates. See:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot-yml-file#groups
#
# `cooldown` blocks force every routine bump to soak in the wild before
# Dependabot opens a PR — long enough to surface most regressions without
# starving CVE coverage. Cooldown applies to *version* updates only; Dependabot
# security updates (CVE-driven) bypass cooldown entirely and ship same-day,
# which is the whole point of the split. Cooldown is per-ecosystem block —
# Dependabot's parser does not honour YAML anchors, so the block is repeated by
# hand.
#
# ⚠ The granular `semver-major-days` / `semver-minor-days` / `semver-patch-days`
# keys are ONLY valid for semver ecosystems (npm). Dependabot's parser REJECTS
# them for `github-actions`, `docker`, and `docker-compose` (tags/digests, not
# semver) — the whole config fails to load if they appear there. Those
# ecosystems use a single flat `default-days` instead. (npm keeps the granular
# 14-day-major / 7-day-minor-patch split where breaking-change blast-radius
# lives, e.g. archiver 7→8 going pure-ESM and breaking the postal-export worker
# the day it was tagged on npm.)
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # The three Dockerfiles below (`/Dockerfile`, `/packages/api/Dockerfile`,
  # `/packages/worker/Dockerfile`) all `FROM node:22-alpine`. CLAUDE.md
  # and docs/02-reference-architecture.md pin the runtime to "Node.js 22
  # LTS"; CI (`.github/workflows/ci.yml`) pins `node-version: "22"` to
  # match. Node has no entry in `infra/compliance-versions.yml` (that
  # gate is Scaleway-anchored: postgres + redis only), so a Node major
  # bump would otherwise sail through CI uncaught — Dockerfile shipping
  # Node 26 while CI tests on 22, regressions in native deps (`sharp`,
  # libvips, BullMQ) invisible until staging.
  #
  # Ignore Node major bumps until either (a) Node 26 reaches LTS
  # (October 2026) or (b) a coordinated 22 → 24 LTS cutover lands the
  # bump across Dockerfiles + CI + `engines` + docs in a single PR.
  # Minor/patch updates still flow normally so CVE coverage on the
  # node:22 line stays intact. Pattern: same intent as the
  # compliance-versions gate, encoded here because Node isn't a
  # provider-managed dependency and doesn't fit the manifest's shape.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /infra/keycloak
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /packages/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /packages/worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # Scans `image:` pins inside Compose files. Covers the local-dev stack
  # (`docker-compose.yml`: postgres, redis, keycloak, seaweedfs, aws-cli, mailpit,
  # caddy) — none of which sit behind a Dockerfile, so without this block
  # base-image CVEs in the runtime path are invisible. ADR-017 calls out
  # per-tool CVE visibility as the corollary of per-tool DB isolation.
  # `docker-compose` ecosystem went GA Feb 2025; it parses the same set
  # of Compose files Docker itself does (`docker-compose.yml`,
  # `compose.yaml`, etc.) under the configured directory.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Compliance-anchored dependencies (postgres, redis) are NOT ignored
    # here on purpose: Dependabot still opens major-bump PRs so the CVE
    # feed and upstream-release visibility stay intact. The
    # `compliance-versions-gate` CI job (driven by
    # `infra/compliance-versions.yml`) fails the build on any pin that
    # exceeds the declared provider ceiling, so out-of-policy bumps
    # can't merge accidentally. Pattern documented in ADR-026.
