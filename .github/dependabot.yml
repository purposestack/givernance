version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/keycloak
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /packages/api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /packages/worker
    schedule:
      interval: weekly
