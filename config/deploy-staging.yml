# Name of your application. Used to uniquely configure containers.
service: givernance

# Name of the container image.
image: purposestack/givernance

# Deploy to these servers.
servers:
  web:
    hosts:
      - <%= ENV["STAGING_VPS_IP"] %>
    cmd: pnpm --filter @givernance/web run start
  api:
    hosts:
      - <%= ENV["STAGING_VPS_IP"] %>
    cmd: pnpm --filter @givernance/api run start
    proxy:
      host: api.staging.givernance.org
      healthcheck:
        path: /healthz
  worker:
    hosts:
      - <%= ENV["STAGING_VPS_IP"] %>
    cmd: pnpm --filter @givernance/worker run start
  # Outbox relay — polls outbox_events and republishes to BullMQ
  # (givernance_events queue), which fans out to the typed worker queues
  # (emails, receipts, etc). Without this process, every domain event
  # (invitation.created, signup.created, …) sits forever with
  # status='pending' and the worker never sees a job. Single instance
  # is fine: the relay uses SELECT … FOR UPDATE SKIP LOCKED, so adding
  # more later just shards work.
  relay:
    hosts:
      - <%= ENV["STAGING_VPS_IP"] %>
    cmd: pnpm --filter @givernance/relay run start

proxy:
  ssl: true
  host: staging.givernance.org
  app_port: 3000
  healthcheck:
    path: /api/healthz

# Credentials for your image host.
registry:
  server: ghcr.io
  username: <%= ENV["GITHUB_ACTOR"] %>
  password:
    - GITHUB_TOKEN

# Inject ENV variables into containers (secrets come from .env).
# Remember to run `kamal env push` after making changes!
env:
  clear:
    NODE_ENV: production
    PORT: 3000
    APP_URL: https://staging.givernance.org
    NEXT_PUBLIC_APP_URL: https://staging.givernance.org
    # Browser API calls always go same-origin and Next.js rewrites
    # `/api/v1/*` to `${API_URL}/v1/*` server-side (see packages/web/next.config.ts).
    # Pointing the browser directly at the api.* subdomain breaks every
    # cookie-based call (cross-origin, JWT cookie not carried) — surfaced as
    # a silent empty list in the donation form's constituent picker and as
    # 5xx on every PUT/PATCH form submit.
    NEXT_PUBLIC_API_URL: /api
    # Server-side SSR resolves the API via the kamal-proxy public hostname.
    # Kamal app containers carry a per-deploy version suffix and Kamal does
    # not register a stable `givernance-api` alias on the `kamal` network,
    # so we route through the proxy on the same VM.
    API_URL: https://api.staging.givernance.org
    NEXT_PUBLIC_KEYCLOAK_URL: https://auth.staging.givernance.org
    S3_ENDPOINT: http://givernance-minio:9000
    S3_ACCESS_KEY_ID: admin
    KEYCLOAK_URL: https://auth.staging.givernance.org
    KEYCLOAK_INTERNAL_URL: http://givernance-keycloak:8080
    # Worker email backend — issue #190 / docs/05 §3.1. Resend handles
    # transactional sends (signup verification, team invitations) so
    # tenant onboarding flows on staging actually deliver mail. Local
    # dev keeps `mailpit` (the worker's default) — see .env.example.
    #
    # The dedicated staging Resend API key is scoped to the verified
    # `givernance.org` apex (not the `staging.` subdomain), so the
    # Mail-From must live on `givernance.org`. The "Givernance Staging"
    # display name keeps the staging context visible in the recipient's
    # inbox without needing a separate verified subdomain.
    EMAIL_PROVIDER: resend
    EMAIL_FROM: Givernance Staging <noreply@givernance.org>
    # Impersonation step-up gate (issue #24). The API refuses to boot in
    # production mode without this flag set to "true" — it's the only
    # barrier between a stolen super-admin cookie and an arbitrary
    # impersonation session. Staging runs `NODE_ENV=production`, so the
    # boot check fires here too. The route still 403s if the realm hasn't
    # issued an `acr=2` token, which is the intended behavior; we'd
    # rather fail closed on staging than silently weaken the gate.
    IMPERSONATION_REQUIRE_ACR_2: "true"
    # Quick fix for issue #296 — Fastify (API) was returning 431
    # `HPE_HEADER_OVERFLOW` on every authenticated call (`/v1/users/me`,
    # `/v1/admin/impersonation/tenants`, `PATCH /v1/campaigns/...`) for
    # platform-admin sessions. Root cause: `packages/web/src/proxy.ts`
    # injects `Authorization: Bearer <jwt>` AND re-sets the `cookie`
    # header on every request, which marks both as "overridden" and
    # makes Next.js 16 serialise them into `x-middleware-override-headers`
    # + `x-middleware-request-{authorization,cookie}` internal headers
    # that leak into the rewrite to `${API_URL}`. Combined with the three
    # Keycloak-token cookies already in flight (jwt + id_token +
    # refresh_token = ~4.4 KB), the request reaching Fastify approached
    # ~14 KB and tipped over Node's default `--max-http-header-size`
    # of 16 KB on a slightly verbose UA. Bumping to 32 KB buys headroom
    # while we land the proper fix (drop redundant Authorization in the
    # middleware + move id_token/refresh_token out of cookies into Redis).
    # Applied at the root `env: clear:` level so every Node service
    # (web, api, worker, relay) gets the same setting — simpler than
    # per-service overrides and harmless for the queue workers.
    NODE_OPTIONS: "--max-http-header-size=32768"
  secret:
    - POSTGRES_PASSWORD
    - REDIS_PASSWORD
    - MINIO_ROOT_PASSWORD
    - KEYCLOAK_ADMIN_PASSWORD
    - SESSION_SECRET
    - DATABASE_URL
    - DATABASE_URL_APP
    - REDIS_URL
    - S3_SECRET_ACCESS_KEY
    - KEYCLOAK_ADMIN_CLIENT_SECRET
    - RESEND_API_KEY
    # Stripe Connect — set via GitHub Actions secrets (staging
    # environment), written to .kamal/secrets in the deploy workflow.
    # STRIPE_SECRET_KEY is the platform `sk_test_…` / `sk_live_…`;
    # STRIPE_WEBHOOK_SECRET is the signing secret from the Stripe
    # dashboard webhook endpoint pointing at
    # https://api.staging.givernance.org/v1/donations/stripe-webhook
    # (NOT the local-dev `stripe listen` value — that one rotates per
    # session). See docs/dev/stripe-local-setup.md → Staging.
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    # Symmetric HS256 secret the API uses to sign app-layer impersonation
    # JWTs and the web SSR uses to verify them (issue #24). Required in
    # production — the boot check in packages/api/src/env.ts exits 1
    # without it, which is what took the api role down on every deploy
    # after 1e49f8e. Set via GH Actions staging environment; non-load-
    # bearing fallback in setup-kamal-secrets/action.yml so a fresh fork
    # still boots.
    - IMPERSONATION_JWT_SECRET

# Configure builder setup.
builder:
  arch: amd64
  dockerfile: Dockerfile
  # Registry-backed BuildKit cache — without this, the `kamal-local-docker-container`
  # buildx builder is recreated from scratch on every CI run, losing the pnpm
  # store mount cache and forcing a full `pnpm install` + `pnpm -r build`
  # (~76s of the deploy). Storing the cache as a sibling tag in GHCR lets
  # subsequent runs reuse the install/build layers. `mode=max` exports
  # intermediate layers (not just the final ones) for better hit rates;
  # the existing `packages: write` permission on the deploy workflow covers
  # the cache image push.
  #
  # IMPORTANT: `image:` is the path RELATIVE TO `registry.server` above.
  # Kamal joins them at build time, so do NOT include `ghcr.io/` here —
  # an earlier version of this PR did, which produced a cache image at
  # `ghcr.io/ghcr.io/purposestack/givernance-build-cache` (doubled host).
  # Fully-qualified resolved ref: `ghcr.io/purposestack/givernance-build-cache`.
  cache:
    type: registry
    image: purposestack/givernance-build-cache
    options: mode=max
  args:
    # The Next.js rewrite destination is baked into routes-manifest.json
    # at build time (see Dockerfile ARG API_URL comment). `env.clear`
    # injection at runtime cannot reach it.
    API_URL: https://api.staging.givernance.org
    # Stripe publishable key — same Next.js build-time-inlining constraint
    # as API_URL. Sourced from a shell env var the deploy workflow exports
    # before invoking `kamal setup` (publishable keys are public per
    # Stripe docs, but pulling from CI secrets keeps the test/live
    # environments separated). Empty fallback so a missing secret surfaces
    # the donor's "Stripe is not configured" message instead of a silently
    # broken Stripe.js init.
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: <%= ENV.fetch("NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY", "") %>

# Use accessories for external services
accessories:
  postgres:
    # Major version anchored to Scaleway Managed PostgreSQL EU's ceiling
    # via `infra/compliance-versions.yml` (ADR-026). Cutover from PG 16
    # to PG 17 ran via `migrate-staging-postgres.yml` on 2026-05-07
    # (run 25511200127); this line aligns the checked-in config with
    # the running PG 17 accessory.
    image: postgres:17
    host: <%= ENV["STAGING_VPS_IP"] %>
    port: 5432
    env:
      clear:
        POSTGRES_USER: givernance
        POSTGRES_DB: givernance_staging
        # Keycloak runs against a dedicated logical database + role on the
        # same Postgres cluster, per ADR-017. The init script mounted via
        # `files:` below provisions both the first time this cluster ever
        # boots an empty datadir.
        #
        # The live staging cluster pre-dates this wiring — it was first
        # bootstrapped while Keycloak was co-located in `givernance_staging`.
        # `docs/runbooks/migrate-staging-keycloak-db.md` (issue #283) is the
        # one-shot blue-green cutover that brings the running cluster into
        # ADR-017 compliance. After that runbook completes and its follow-up
        # PR merges, the keycloak accessory below points at
        # `givernance_keycloak` and these env vars start being load-bearing
        # (any future datadir wipe + re-init reproduces the dedicated DB).
        KEYCLOAK_DB_NAME: givernance_keycloak
        KEYCLOAK_DB_USER: keycloak
      secret:
        - POSTGRES_PASSWORD
        - KEYCLOAK_DB_PASSWORD
    files:
      # Mounted into /docker-entrypoint-initdb.d, which the postgres image
      # only executes on a brand-new datadir (PG_VERSION absent). Shipping
      # it here makes a future fresh-init produce an ADR-017-compliant
      # cluster with no operator intervention; on the existing staging
      # datadir it's an inert bind-mount.
      - infra/postgres/init/01-init-keycloak-db.sh:/docker-entrypoint-initdb.d/01-init-keycloak-db.sh
    directories:
      - data/postgres:/var/lib/postgresql/data
  redis:
    image: redis:8
    host: <%= ENV["STAGING_VPS_IP"] %>
    # No `port:` publishing — Redis is reachable only on the internal `kamal`
    # Docker network at `givernance-redis:6379`. Closes the public 0.0.0.0:6379
    # exposure that combined with an empty `requirepass` let any internet-side
    # actor read/write BullMQ queues + session cache. App services
    # (api/web/worker/relay) keep reaching Redis via the kamal network with
    # no change. Operator access via `docker exec givernance-redis redis-cli`
    # over SSH, or a sidecar container on the kamal network — RedisInsight /
    # Beekeeper need either of those paths now (no host port to tunnel to).
    env:
      secret:
        - REDIS_PASSWORD
    # Enforce authentication. Redis 8's default startup has `requirepass`
    # empty, so AUTH commands are accepted-then-ignored ("Client sent AUTH,
    # but no password is set on the 'default' user"). Setting requirepass
    # here makes every connection require the password from the bag, which
    # `setup-kamal-secrets` already wires into REDIS_URL for every app.
    #
    # Array form (NOT a string scalar) is load-bearing: kamal serialises a
    # string-form `cmd:` such that `$REDIS_PASSWORD` gets shell-expanded on
    # the GH Actions runner — where REDIS_PASSWORD is NOT exported (only
    # POSTGRES_PASSWORD lands in runner env via `setup-kamal-secrets`) — so
    # the literal `$REDIS_PASSWORD` resolves to empty BEFORE reaching docker
    # and Redis ends up booting with `--requirepass ""` (== no auth).
    # Passing an array delegates to docker's exec form, the inner `sh -c`
    # then runs INSIDE the container where REDIS_PASSWORD IS in env.
    cmd:
      - sh
      - -c
      - exec redis-server --requirepass "$REDIS_PASSWORD"
    directories:
      - data/redis:/data
  minio:
    image: minio/minio:latest
    host: <%= ENV["STAGING_VPS_IP"] %>
    # No `port:` publishing — MinIO is reachable only on the internal
    # `kamal` Docker network at `givernance-minio:9000`. Closes the
    # browser-facing presigned-URL hole that issue #214 fixed: the API
    # streams receipts through `:id/receipt/download`, so no donor
    # browser ever needs to resolve port 9000 directly. The bucket-
    # creation step in deploy-staging.yml uses `--network kamal` so it
    # still works without a published port. Local docker-compose still
    # publishes 9000 — that's intentional, the local console UI + `mc`
    # from the host shell both need it.
    #
    # When `deploy-prod.yml` lands, do NOT re-publish port 9000 — the
    # streaming endpoint covers every browser-facing path. Adding
    # `port: 9000` to the prod accessory would silently re-open the
    # public attack surface this PR closed.
    env:
      clear:
        MINIO_ROOT_USER: admin
      secret:
        - MINIO_ROOT_PASSWORD
        # The worker uploads receipt + campaign PDFs with
        # `ServerSideEncryption: "AES256"`. MinIO refuses that header
        # without a KMS-equivalent backing key (Scaleway / AWS S3 manage
        # SSE-S3 keys natively, MinIO doesn't). Without this every PDF
        # upload DLQs with `NotImplemented: Server side encryption
        # specified but KMS is not configured`. Format: `<key-name>:
        # <base64-encoded-32-byte-secret>`. Generated with
        # `openssl rand -base64 32`; rotate by changing the GitHub secret
        # and redeploying — existing-encrypted-objects survive the rotation
        # only if the previous key is added as a fallback (we don't, since
        # staging data is non-load-bearing; if you keep PDFs across a
        # rotation, MinIO's `MINIO_KMS_AUTO_ENCRYPTION` is the option to
        # configure backwards compat).
        - MINIO_KMS_SECRET_KEY
    directories:
      - data/minio:/data
    cmd: server /data --console-address ":9001"
  keycloak:
    image: ghcr.io/purposestack/givernance-keycloak:latest
    host: <%= ENV["STAGING_VPS_IP"] %>
    proxy:
      host: auth.staging.givernance.org
      ssl: true
      app_port: 8080
      healthcheck:
        path: /realms/master/.well-known/openid-configuration
    env:
      clear:
        KC_DB: postgres
        KC_DB_URL: jdbc:postgresql://givernance-postgres:5432/givernance_keycloak
        KC_DB_USERNAME: keycloak
        KEYCLOAK_ADMIN: admin
        KC_HOSTNAME: auth.staging.givernance.org
        KC_PROXY_HEADERS: xforwarded
        KC_HOSTNAME_STRICT: "false"
        KC_HTTP_ENABLED: "true"
        KC_HEALTH_ENABLED: "true"
        KC_IMPORT_STRATEGY: "OVERWRITE_EXISTING"
      secret:
        - KC_DB_PASSWORD
        - KEYCLOAK_ADMIN_PASSWORD
    files:
      - infra/keycloak/realm-givernance.json:/opt/keycloak/data/import/realm.json
      # Staging-specific theme.properties — overrides the dev value
      # baked into the custom Keycloak image (`infra/keycloak/Dockerfile`)
      # so `info.ftl` resolves `${properties.gvAppLoginUrl}` to the
      # staging SPA URL. Without this mount the post-action page would
      # link new admins at `http://localhost:3000/login` (issue #254
      # PR #253 smoke-test feedback).
      - infra/keycloak/themes/givernance/login/theme.staging.properties:/opt/keycloak/themes/givernance/login/theme.properties
    cmd: start-dev --import-realm
