# Name of your application. Used to uniquely configure containers.
service: givernance

# Name of the container image.
image: purposestack/givernance

# Deploy to these servers.
servers:
  web:
    hosts:
      - <%= ENV["STAGING_VPS_IP"] %>
    cmd: pnpm --filter @givernance/web run start
  api:
    hosts:
      - <%= ENV["STAGING_VPS_IP"] %>
    cmd: pnpm --filter @givernance/api run start
    proxy:
      host: api.staging.givernance.org
      healthcheck:
        path: /healthz
  worker:
    hosts:
      - <%= ENV["STAGING_VPS_IP"] %>
    cmd: pnpm --filter @givernance/worker run start
  # Outbox relay — polls outbox_events and republishes to BullMQ
  # (givernance_events queue), which fans out to the typed worker queues
  # (emails, receipts, etc). Without this process, every domain event
  # (invitation.created, signup.created, …) sits forever with
  # status='pending' and the worker never sees a job. Single instance
  # is fine: the relay uses SELECT … FOR UPDATE SKIP LOCKED, so adding
  # more later just shards work.
  relay:
    hosts:
      - <%= ENV["STAGING_VPS_IP"] %>
    cmd: pnpm --filter @givernance/relay run start

proxy:
  ssl: true
  host: staging.givernance.org
  app_port: 3000
  healthcheck:
    path: /api/healthz

# Credentials for your image host.
registry:
  server: ghcr.io
  username: <%= ENV["GITHUB_ACTOR"] %>
  password:
    - GITHUB_TOKEN

# Inject ENV variables into containers (secrets come from .env).
# Remember to run `kamal env push` after making changes!
env:
  clear:
    NODE_ENV: production
    PORT: 3000
    APP_URL: https://staging.givernance.org
    NEXT_PUBLIC_APP_URL: https://staging.givernance.org
    # Browser API calls always go same-origin and Next.js rewrites
    # `/api/v1/*` to `${API_URL}/v1/*` server-side (see packages/web/next.config.ts).
    # Pointing the browser directly at the api.* subdomain breaks every
    # cookie-based call (cross-origin, JWT cookie not carried) — surfaced as
    # a silent empty list in the donation form's constituent picker and as
    # 5xx on every PUT/PATCH form submit.
    NEXT_PUBLIC_API_URL: /api
    # Server-side SSR resolves the API via the kamal-proxy public hostname.
    # Kamal app containers carry a per-deploy version suffix and Kamal does
    # not register a stable `givernance-api` alias on the `kamal` network,
    # so we route through the proxy on the same VM.
    API_URL: https://api.staging.givernance.org
    NEXT_PUBLIC_KEYCLOAK_URL: https://auth.staging.givernance.org
    S3_ENDPOINT: http://givernance-seaweedfs:8333
    S3_ACCESS_KEY_ID: admin
    # Browser-reachable base for the `branding` (public-read, ADR-023)
    # bucket. The default in `brandingPublicUrl()` falls back to
    # `${S3_ENDPOINT}/${S3_BRANDING_BUCKET}` — fine for docker-compose
    # where MinIO is published on the host, but unresolvable from the
    # browser on staging where the accessory only lives on the internal
    # `kamal` network. We front bucket reads through kamal-proxy on
    # `assets.staging.givernance.org` (see the seaweedfs accessory's `proxy:`
    # block below); same hostname serves the donation page hero and the
    # Keycloak login template's `organization.attributes['logo_url']`,
    # so the KC HTTPS-only guard accepts it without a CDN.
    KEYCLOAK_LOGO_PUBLIC_URL_BASE: https://assets.staging.givernance.org/branding
    KEYCLOAK_URL: https://auth.staging.givernance.org
    KEYCLOAK_INTERNAL_URL: http://givernance-keycloak:8080
    # Worker email backend — issue #190 / docs/05 §3.1. Resend handles
    # transactional sends (signup verification, team invitations) so
    # tenant onboarding flows on staging actually deliver mail. Local
    # dev keeps `mailpit` (the worker's default) — see .env.example.
    #
    # The dedicated staging Resend API key is scoped to the verified
    # `givernance.org` apex (not the `staging.` subdomain), so the
    # Mail-From must live on `givernance.org`. The "Givernance Staging"
    # display name keeps the staging context visible in the recipient's
    # inbox without needing a separate verified subdomain.
    EMAIL_PROVIDER: resend
    EMAIL_FROM: Givernance Staging <noreply@givernance.org>
    # Impersonation step-up gate (issue #24). The API refuses to boot in
    # production mode without this flag set to "true" — it's the only
    # barrier between a stolen super-admin cookie and an arbitrary
    # impersonation session. Staging runs `NODE_ENV=production`, so the
    # boot check fires here too. The route still 403s if the realm hasn't
    # issued an `acr=2` token, which is the intended behavior; we'd
    # rather fail closed on staging than silently weaken the gate.
    IMPERSONATION_REQUIRE_ACR_2: "true"
    # NOTE (issue #296): the `NODE_OPTIONS=--max-http-header-size=32768`
    # band-aid that lived here is removed. The proper fix shipped in the
    # proxy + auth cookies: `Authorization` injection and the per-request
    # `cookie` re-set are gone, and `id_token` + `refresh_token` are scoped
    # to `Path=/api/auth`, so authenticated requests reaching Fastify now
    # carry only `givernance_jwt` + `csrf-token` and stay well under Node's
    # default 16 KB header limit.
  secret:
    - POSTGRES_PASSWORD
    - REDIS_PASSWORD
    - KEYCLOAK_ADMIN_PASSWORD
    - SESSION_SECRET
    - DATABASE_URL
    - DATABASE_URL_APP
    - REDIS_URL
    - S3_SECRET_ACCESS_KEY
    - KEYCLOAK_ADMIN_CLIENT_SECRET
    - RESEND_API_KEY
    # Stripe Connect — set via GitHub Actions secrets (staging
    # environment), written to .kamal/secrets in the deploy workflow.
    # STRIPE_SECRET_KEY is the platform `sk_test_…` / `sk_live_…`;
    # STRIPE_WEBHOOK_SECRET is the signing secret from the Stripe
    # dashboard webhook endpoint pointing at
    # https://api.staging.givernance.org/v1/donations/stripe-webhook
    # (NOT the local-dev `stripe listen` value — that one rotates per
    # session). See docs/dev/stripe-local-setup.md → Staging.
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    # Symmetric HS256 secret the API uses to sign app-layer impersonation
    # JWTs and the web SSR uses to verify them (issue #24). Required in
    # production — the boot check in packages/api/src/env.ts exits 1
    # without it, which is what took the api role down on every deploy
    # after 1e49f8e. Set via GH Actions staging environment; non-load-
    # bearing fallback in setup-kamal-secrets/action.yml so a fresh fork
    # still boots.
    - IMPERSONATION_JWT_SECRET

# Configure builder setup.
builder:
  arch: amd64
  dockerfile: Dockerfile
  # Registry-backed BuildKit cache — without this, the `kamal-local-docker-container`
  # buildx builder is recreated from scratch on every CI run, losing the pnpm
  # store mount cache and forcing a full `pnpm install` + `pnpm -r build`
  # (~76s of the deploy). Storing the cache as a sibling tag in GHCR lets
  # subsequent runs reuse the install/build layers. `mode=max` exports
  # intermediate layers (not just the final ones) for better hit rates;
  # the existing `packages: write` permission on the deploy workflow covers
  # the cache image push.
  #
  # IMPORTANT: `image:` is the path RELATIVE TO `registry.server` above.
  # Kamal joins them at build time, so do NOT include `ghcr.io/` here —
  # an earlier version of this PR did, which produced a cache image at
  # `ghcr.io/ghcr.io/purposestack/givernance-build-cache` (doubled host).
  # Fully-qualified resolved ref: `ghcr.io/purposestack/givernance-build-cache`.
  cache:
    type: registry
    image: purposestack/givernance-build-cache
    options: mode=max
  args:
    # The Next.js rewrite destination is baked into routes-manifest.json
    # at build time (see Dockerfile ARG API_URL comment). `env.clear`
    # injection at runtime cannot reach it.
    API_URL: https://api.staging.givernance.org
    # Stripe publishable key — same Next.js build-time-inlining constraint
    # as API_URL. Sourced from a shell env var the deploy workflow exports
    # before invoking `kamal setup` (publishable keys are public per
    # Stripe docs, but pulling from CI secrets keeps the test/live
    # environments separated). Empty fallback so a missing secret surfaces
    # the donor's "Stripe is not configured" message instead of a silently
    # broken Stripe.js init.
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: <%= ENV.fetch("NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY", "") %>

# Use accessories for external services
accessories:
  postgres:
    # Major version anchored to Scaleway Managed PostgreSQL EU's ceiling
    # via `infra/compliance-versions.yml` (ADR-026). Cutover from PG 16
    # to PG 17 ran via `migrate-staging-postgres.yml` on 2026-05-07
    # (run 25511200127); this line aligns the checked-in config with
    # the running PG 17 accessory.
    image: postgres:17
    host: <%= ENV["STAGING_VPS_IP"] %>
    # No `port:` publishing — Postgres is reachable only on the internal `kamal`
    # Docker network at `givernance-postgres:5432`. Closes the public 0.0.0.0:5432
    # exposure that was a defense-in-depth gap even after rotating
    # POSTGRES_PASSWORD off its committed dev fallback (a 192-bit password
    # makes brute-force infeasible, but the principle is "least exposure
    # consistent with the operator workflow"). App services
    # (api/web/worker/relay) keep reaching Postgres via the kamal network with
    # no change. Operator access patterns post-tightening:
    #   - `ssh givernance-staging "docker exec -i givernance-postgres psql ..."` — quickest for inline queries
    #   - SSH tunnel to the kamal-network container IP for Beekeeper / pgAdmin:
    #       ssh -L 5433:$(ssh givernance-staging "docker inspect givernance-postgres --format '{{(index .NetworkSettings.Networks \"kamal\").IPAddress}}'"):5432 givernance-staging
    #     then connect Beekeeper to localhost:5433 (no SSH-tunnel-in-Beekeeper config needed)
    # Same pattern as the redis hardening (#338).
    env:
      clear:
        POSTGRES_USER: givernance
        POSTGRES_DB: givernance_staging
        # Keycloak runs against a dedicated logical database + role on the
        # same Postgres cluster, per ADR-017. The init script mounted via
        # `files:` below provisions both the first time this cluster ever
        # boots an empty datadir.
        #
        # The live staging cluster pre-dates this wiring — it was first
        # bootstrapped while Keycloak was co-located in `givernance_staging`.
        # `docs/runbooks/migrate-staging-keycloak-db.md` (issue #283) is the
        # one-shot blue-green cutover that brings the running cluster into
        # ADR-017 compliance. After that runbook completes and its follow-up
        # PR merges, the keycloak accessory below points at
        # `givernance_keycloak` and these env vars start being load-bearing
        # (any future datadir wipe + re-init reproduces the dedicated DB).
        KEYCLOAK_DB_NAME: givernance_keycloak
        KEYCLOAK_DB_USER: keycloak
      secret:
        - POSTGRES_PASSWORD
        - KEYCLOAK_DB_PASSWORD
        # Issue #430 — the application role `givernance_app` (NOBYPASSRLS)
        # gets its password from this secret. The init script below
        # provisions it on first cluster boot; on an existing datadir the
        # one-shot SQL in `docs/runbooks/feature-flag-rollback.md`'s sibling
        # `docs/runbooks/givernance-app-password-rotation.md` rotates it
        # without restarting the accessory.
        - GIVERNANCE_APP_PASSWORD
    files:
      # Mounted into /docker-entrypoint-initdb.d, which the postgres image
      # only executes on a brand-new datadir (PG_VERSION absent). Shipping
      # both makes a future fresh-init produce an ADR-017-compliant +
      # issue-#430-compliant cluster with no operator intervention; on the
      # existing staging datadir both are inert bind-mounts.
      - infra/postgres/init/01-init-keycloak-db.sh:/docker-entrypoint-initdb.d/01-init-keycloak-db.sh
      - infra/postgres/init/02-init-givernance-app-role.sh:/docker-entrypoint-initdb.d/02-init-givernance-app-role.sh
    directories:
      - data/postgres:/var/lib/postgresql/data
  redis:
    image: redis:8
    host: <%= ENV["STAGING_VPS_IP"] %>
    # No `port:` publishing — Redis is reachable only on the internal `kamal`
    # Docker network at `givernance-redis:6379`. Closes the public 0.0.0.0:6379
    # exposure that combined with an empty `requirepass` let any internet-side
    # actor read/write BullMQ queues + session cache. App services
    # (api/web/worker/relay) keep reaching Redis via the kamal network with
    # no change. Operator access via `docker exec givernance-redis redis-cli`
    # over SSH, or a sidecar container on the kamal network — RedisInsight /
    # Beekeeper need either of those paths now (no host port to tunnel to).
    env:
      secret:
        - REDIS_PASSWORD
    files:
      # Boot wrapper that invokes `redis-server --requirepass "$REDIS_PASSWORD"`
      # from INSIDE the container, where REDIS_PASSWORD is in env. We can't
      # put that string directly in `cmd:` below because kamal serialises a
      # string-form cmd in a way that shell-expands `$REDIS_PASSWORD` on the
      # GH Actions runner first (where the var is NOT set), turning it into
      # `--requirepass ""`. Array-form cmd would dodge that, but kamal
      # rejects it for accessories (`should be a string` ConfigurationError).
      # See `infra/redis/start.sh` and the issue-#283 follow-up PR for the
      # full debug trace.
      - infra/redis/start.sh:/usr/local/bin/start-redis.sh
    # Enforce authentication. Redis 8's default startup has `requirepass`
    # empty, so AUTH commands are accepted-then-ignored ("Client sent AUTH,
    # but no password is set on the 'default' user"). The wrapper script
    # mounted above sets `--requirepass` from `$REDIS_PASSWORD` (sourced from
    # `.kamal/secrets` via the `env.secret` block) and `exec`s redis-server
    # so it ends up as PID 1.
    cmd: sh /usr/local/bin/start-redis.sh
    directories:
      - data/redis:/data
  seaweedfs:
    # ADR-034 — SeaweedFS replaces MinIO (Apache 2.0, actively maintained;
    # MinIO entered maintenance-mode with no security patches in Dec 2025).
    # Production (SaaS) is unaffected — it stays on Scaleway Object Storage
    # (ADR-009). Single-node `weed server -s3`: master(9333)+volume(8080)+
    # filer(8888)+S3 gateway(8333).
    image: chrislusf/seaweedfs:4.31
    host: <%= ENV["STAGING_VPS_IP"] %>
    # No `port:` publishing — the S3 API stays off the public internet at
    # givernance-seaweedfs:8333 on the kamal network. Receipts + campaigns +
    # reports + bulk-imports are served via the API streaming endpoints
    # (issue #214) so no donor browser needs raw 8333 access for them.
    #
    # The `branding` bucket (Epic #286 / ADR-023) is a deliberate exception:
    # it's public-read so donor-facing surfaces (donation page hero, Keycloak
    # login template logo) can fetch directly with `Cache-Control: public,
    # max-age=31536000, immutable` and a future CDN edge can cache content-
    # addressed keys. We expose that read path through kamal-proxy on
    # `assets.staging.givernance.org` → the S3 gateway. Filtering is done by
    # the SeaweedFS identities in the mounted s3config.json (ADR-034), NOT by
    # runtime ACLs:
    #   - `branding`  → anonymous GetObject allowed (the `anonymous`
    #                   identity grants `Read:branding` and nothing else)
    #   - everything else → 403 anonymous (no anonymous identity covers it,
    #                   S3-auth required) — an accidental public bulk-imports
    #                   leak (donor PII) is structurally impossible.
    # The filer UI (8888) is NOT exposed by the proxy (only `app_port: 8333`)
    # so the object browser stays internal.
    #
    # When `deploy-prod.yml` lands, mirror this exactly: a public hostname
    # (or a CDN in front of the bucket) for `branding`, no public path to the
    # private buckets.
    #
    # Note (2026-05-12, carried from MinIO): the first deploy that adds a
    # `proxy:` block on an already-running accessory fails because
    # `kamal accessory reboot` issues `kamal-proxy remove` even when nothing
    # is registered yet ("service not found"). The reboot step in
    # `.github/workflows/deploy-staging.yml` + the composite action
    # `.github/actions/reboot-kamal-accessory/action.yml` drive the sequence
    # manually; this comment also tickles the per-accessory subtree-diff gate
    # so the accessory actually re-bootstraps.
    proxy:
      host: assets.staging.givernance.org
      ssl: true
      app_port: 8333
      healthcheck:
        path: /status
    env:
      secret:
        # SSE-S3 Key-Encryption-Key. The worker uploads receipt/campaign/
        # report PDFs with `ServerSideEncryption: "AES256"`; SeaweedFS derives
        # the envelope-encryption master key (KEK) from this passphrase (HKDF)
        # so those PutObjects succeed (ADR-034). Replaces MinIO's
        # `MINIO_KMS_SECRET_KEY` — no 32-byte-base64 length constraint.
        # MUST stay STABLE across reboots or previously-encrypted objects
        # become unreadable (same property the old KMS key had). Rotate by
        # changing the GH secret + re-encrypting; staging data is non-load-
        # bearing so a rotation just orphans old encrypted blobs.
        - WEED_S3_SSE_KEY
    files:
      # Rendered at deploy time by `.github/actions/setup-kamal-secrets` from
      # the `SEAWEEDFS_S3_SECRET_KEY` secret — carries the `admin` S3 identity
      # (same secret the apps use as `S3_SECRET_ACCESS_KEY`) and the
      # `anonymous Read:branding` identity. Gitignored; never committed with a
      # real secret. See docs/runbooks/minio-to-seaweedfs-cutover.md.
      - config/seaweedfs/s3config.staging.json:/etc/seaweedfs/s3config.json
    directories:
      - data/seaweedfs:/data
    # `-ip.bind=0.0.0.0` so the gateway listens on all interfaces (kamal-proxy
    # + cross-container both reach it); advertised IP is the auto-detected
    # container IP, reachable on the kamal network.
    cmd: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3config.json -ip.bind=0.0.0.0
  keycloak:
    image: ghcr.io/purposestack/givernance-keycloak:latest
    host: <%= ENV["STAGING_VPS_IP"] %>
    proxy:
      host: auth.staging.givernance.org
      ssl: true
      app_port: 8080
      # Keycloak re-imports the realm JSON + runs Liquibase migrations on every
      # boot (KC_IMPORT_STRATEGY=OVERWRITE_EXISTING below). On the 2026-06-05
      # incident (deploy aa8f8f01) the master-realm well-known endpoint took
      # longer than kamal-proxy's default 30s deploy-timeout to answer, so
      # `kamal accessory boot` timed out re-registering the `auth.*` route.
      #
      # A `deploy_timeout: 120` was added here (commit f27e4934) to widen that
      # window — but `deploy_timeout` is NOT a valid Kamal 2.11 accessory-proxy
      # key: it aborts EVERY `kamal deploy` at config-parse time with
      # `ConfigurationError: accessories/keycloak/proxy: unknown key:
      # deploy_timeout`. So the "fix" silently broke all deploys. Removed.
      #
      # The cold boot only blew past 30s because the in-process monthly-report
      # cron was busy-looping a CPU core (PR #479), inflating Quarkus
      # augmentation from ~12-15s to 27s. With that root cause fixed, the
      # default 30s has comfortable margin again. If a longer proxy wait is ever
      # genuinely needed, use a mechanism the pinned Kamal version actually
      # accepts (validate against the gem) — not this key. Recovery runbook:
      # docs/runbooks/keycloak-proxy-route-recovery.md.
      healthcheck:
        path: /realms/master/.well-known/openid-configuration
    env:
      clear:
        KC_DB: postgres
        KC_DB_URL: jdbc:postgresql://givernance-postgres:5432/givernance_keycloak
        KC_DB_USERNAME: keycloak
        KEYCLOAK_ADMIN: admin
        KC_HOSTNAME: auth.staging.givernance.org
        KC_PROXY_HEADERS: xforwarded
        KC_HOSTNAME_STRICT: "false"
        KC_HTTP_ENABLED: "true"
        KC_HEALTH_ENABLED: "true"
        KC_IMPORT_STRATEGY: "OVERWRITE_EXISTING"
      secret:
        - KC_DB_PASSWORD
        - KEYCLOAK_ADMIN_PASSWORD
    files:
      - infra/keycloak/realm-givernance.json:/opt/keycloak/data/import/realm.json
      # Staging-specific theme.properties — overrides the dev value
      # baked into the custom Keycloak image (`infra/keycloak/Dockerfile`)
      # so `info.ftl` resolves `${properties.gvAppLoginUrl}` to the
      # staging SPA URL. Without this mount the post-action page would
      # link new admins at `http://localhost:3000/login` (issue #254
      # PR #253 smoke-test feedback).
      - infra/keycloak/themes/givernance/login/theme.staging.properties:/opt/keycloak/themes/givernance/login/theme.properties
    cmd: start-dev --import-realm
