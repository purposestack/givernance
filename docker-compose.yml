## Givernance — local development stack
## Usage: docker compose up -d
## Docs:  docs/infra/README.md

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      # Bootstrap superuser + application database.
      POSTGRES_DB: ${POSTGRES_DB:-givernance}
      POSTGRES_USER: ${POSTGRES_USER:-givernance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-givernance_dev}
      # Consumed by /docker-entrypoint-initdb.d/01-init-keycloak-db.sh on
      # first boot to provision Keycloak's own database + role (ADR-017).
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-givernance_keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-givernance}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    # Keycloak 26.x: Organizations is GA as of 26.0 (ADR-016 / issue #114).
    # Image tag pinned to 26.6.1 (latest stable patch as of 2026-04-15).
    image: quay.io/keycloak/keycloak:26.6.1
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      # Keycloak runs against its own logical database + dedicated role so
      # a schema upgrade or restore on either side can't clobber the other.
      # See docs/15-infra-adr.md (ADR-017).
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-givernance_keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak/realm-givernance.json:/opt/keycloak/data/import/realm-givernance.json:ro
      # Givernance custom login theme (Approach A — FreeMarker + CSS design tokens).
      # Keycloak resolves themes from /opt/keycloak/themes/<name>/ at startup.
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo done"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-givernance}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-givernance_dev}
      # Server-side AES256 encryption requires KMS-equivalent backing on
      # MinIO (Scaleway/AWS S3 don't — they manage SSE-S3 keys natively).
      # Without this, every PDF upload from the worker errors with
      # "NotImplemented: Server side encryption specified but KMS is not
      # configured" since the code path uses `ServerSideEncryption: "AES256"`.
      # Format: <key-name>:<base64-encoded-32-byte-secret>. Local-only
      # throwaway value — never used in prod, where Scaleway handles KMS.
      MINIO_KMS_SECRET_KEY: "givernance-kms-dev:cZvoSZTVWEOt2MK+fmq45uqxPT7gEC3btKU+2xFh0zk="
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot init container that creates the buckets the API + worker
  # write to. Without it, the receipt-generation job DLQs with
  # `NoSuchBucket: The specified bucket does not exist` on the very
  # first donation. Idempotent (`mc mb --ignore-existing`), so safe on
  # every `docker compose up`.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-givernance}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-givernance_dev}
      S3_RECEIPTS_BUCKET: ${S3_RECEIPTS_BUCKET:-receipts}
      S3_CAMPAIGNS_BUCKET: ${S3_CAMPAIGNS_BUCKET:-campaigns}
      # Org-branding bucket (Epic #286) — public-read for donor-facing
      # surfaces (Keycloak login template, donation page hero).
      S3_BRANDING_BUCKET: ${S3_BRANDING_BUCKET:-branding}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_RECEIPTS_BUCKET"
        mc mb --ignore-existing "local/$$S3_CAMPAIGNS_BUCKET"
        mc mb --ignore-existing "local/$$S3_BRANDING_BUCKET"
        # GC orphan multipart parts after 1 day. The postal-export worker
        # streams a ZIP into S3 via @aws-sdk/lib-storage's multipart Upload;
        # if the source stream is destroyed mid-upload (worker crash, S3
        # transient error), `Upload.done()` rejects but the parts already
        # uploaded persist as orphans on the bucket and are billed forever
        # until garbage-collected. The same lifecycle rule MUST be set on
        # the prod Scaleway campaigns bucket — see docs/23-postal-campaigns.md
        # § 3 "Architecture (key design decisions)".
        # `|| true` keeps idempotency: re-applying an existing rule errors.
        mc ilm rule add --abort-incomplete-multipart-days 1 "local/$$S3_CAMPAIGNS_BUCKET" || true
        mc ilm rule add --abort-incomplete-multipart-days 1 "local/$$S3_RECEIPTS_BUCKET" || true
        mc ilm rule add --abort-incomplete-multipart-days 1 "local/$$S3_BRANDING_BUCKET" || true
        # Branding bucket is public-read at the bucket level — donor-facing
        # surfaces (Keycloak login template, donation page) hit object
        # URLs directly with `Cache-Control: public, max-age=31536000,
        # immutable`. Content-addressed keys make stale-CDN-edge cross-
        # contamination impossible. This MUST be matched in prod via the
        # Scaleway Object Storage bucket policy.
        mc anonymous set download "local/$$S3_BRANDING_BUCKET" || true
        echo "MinIO buckets ready (with abort-incomplete-multipart lifecycle): $$S3_RECEIPTS_BUCKET, $$S3_CAMPAIGNS_BUCKET, $$S3_BRANDING_BUCKET"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - keycloak
    profiles:
      - proxy

volumes:
  pgdata:
  redisdata:
  miniodata:
  mailpitdata:
  caddydata:
  caddyconfig:
