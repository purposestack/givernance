## Givernance — local development stack
## Usage: docker compose up -d
## Docs:  docs/infra/README.md

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      # Bootstrap superuser + application database.
      POSTGRES_DB: ${POSTGRES_DB:-givernance}
      POSTGRES_USER: ${POSTGRES_USER:-givernance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-givernance_dev}
      # Consumed by /docker-entrypoint-initdb.d/01-init-keycloak-db.sh on
      # first boot to provision Keycloak's own database + role (ADR-017).
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-givernance_keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
      # Consumed by /docker-entrypoint-initdb.d/02-init-givernance-app-role.sh
      # on first boot to provision the `givernance_app` runtime role
      # (NOBYPASSRLS, per issue #430 cross-tenant RLS hardening). Default
      # must match the password embedded in DATABASE_URL_APP in `.env` /
      # `.env.example`; rotate one → rotate the other.
      GIVERNANCE_APP_PASSWORD: ${GIVERNANCE_APP_PASSWORD:-givernance_app_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-givernance}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    # Keycloak 26.x: Organizations is GA as of 26.0 (ADR-016 / issue #114).
    # Image tag pinned to 26.6.1 (latest stable patch as of 2026-04-15).
    image: quay.io/keycloak/keycloak:26.7.2-1
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      # Keycloak runs against its own logical database + dedicated role so
      # a schema upgrade or restore on either side can't clobber the other.
      # See docs/15-infra-adr.md (ADR-017).
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-givernance_keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak/realm-givernance.json:/opt/keycloak/data/import/realm-givernance.json:ro
      # Givernance custom login theme (Approach A — FreeMarker + CSS design tokens).
      # Keycloak resolves themes from /opt/keycloak/themes/<name>/ at startup.
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo done"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # SeaweedFS (ADR-034) — Apache-2.0 S3-compatible object store; replaces
  # MinIO, which entered maintenance-mode (no security patches) in Dec 2025.
  # Single-node `weed server -s3` runs master(9333)+volume(8080)+filer(8888)
  # and the S3 gateway on 8333 (MinIO used 9000) in one process. Production
  # (SaaS) is unaffected — it stays on Scaleway Object Storage (ADR-009).
  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    ports:
      # S3 API. Apps (api/worker) reach it in-network at http://seaweedfs:8333.
      - "${S3_PORT:-8333}:8333"
      # Filer browser UI — replaces the MinIO Console (removed from MinIO CE
      # in May 2025). Browse objects at http://localhost:8888 .
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
    environment:
      # SSE-S3 Key-Encryption-Key. The worker sets `ServerSideEncryption:
      # "AES256"` on every receipt/campaign/report PutObject; SeaweedFS
      # derives the envelope-encryption master key (KEK) from this passphrase
      # via HKDF. Replaces MinIO's `MINIO_KMS_SECRET_KEY`. Local-only
      # throwaway — never used in prod (Scaleway manages SSE-S3 keys
      # natively). The KEK must be STABLE across restarts wherever data
      # persists (staging) or previously-encrypted objects become unreadable.
      WEED_S3_SSE_KEY: ${SEAWEEDFS_SSE_KEY:-givernance-dev-sse-kek-do-not-use-in-prod}
    # `-ip.bind=0.0.0.0` makes the gateway listen on all interfaces so the
    # published host port + cross-container access both work; the advertised
    # IP is auto-detected (the container's network IP, reachable in-network).
    # `-s3.config` is the single source of truth for credentials + the
    # `anonymous Read:branding` identity that makes the branding bucket
    # public-read (ADR-023) — there is no `mc anonymous` on SeaweedFS.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3config.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=128
    volumes:
      - seaweedfsdata:/data
      - ./infra/seaweedfs/s3config.json:/etc/seaweedfs/s3config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8333/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot init container that creates the buckets the API + worker write
  # to and applies per-bucket lifecycle (ADR-034 — replaces the MinIO `mc`
  # init). SeaweedFS auto-creates a bucket on first PutObject, so this is
  # belt-and-suspenders for bucket existence, but the lifecycle expiry rules
  # (90d bulk-imports, 365d reports, 1d abort-incomplete-multipart) MUST be
  # applied explicitly via the S3 API — `weed shell` has no expiry command.
  # Public-read for `branding` is NOT set here: it is the static `anonymous`
  # identity in infra/seaweedfs/s3config.json applied at gateway start, so
  # every other bucket denies anonymous reads structurally (no race, no
  # copy-pasted-`mc anonymous set` foot-gun). Idempotent — safe on every
  # `docker compose up`. Mirrors how the prod Scaleway buckets are
  # provisioned (`aws s3api …`).
  seaweedfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-givernance}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-givernance_dev}
      S3_REGION: ${S3_REGION:-fr-par}
      S3_RECEIPTS_BUCKET: ${S3_RECEIPTS_BUCKET:-receipts}
      S3_CAMPAIGNS_BUCKET: ${S3_CAMPAIGNS_BUCKET:-campaigns}
      # Org-branding bucket (Epic #286) — public-read (via s3config.json
      # anonymous identity) for donor-facing surfaces.
      S3_BRANDING_BUCKET: ${S3_BRANDING_BUCKET:-branding}
      # Bulk-import upload bucket (Epic #373) — **private**. Operator CSV/
      # Excel with PII; 90-day lifecycle matches bulk_import_results retention.
      S3_BULK_IMPORT_BUCKET: ${S3_BULK_IMPORT_BUCKET:-bulk-imports}
      # Platform monthly finance reports (issue #443) — **private**, 365-day
      # lifecycle. ADR-023.
      S3_REPORTS_BUCKET: ${S3_REPORTS_BUCKET:-reports}
    # `amazon/aws-cli` sets `aws` as its entrypoint; override so we can run a
    # plain shell script. The script is S3-API-only (no aws-cli-isms) so it
    # is portable to any S3 client during the staging cutover.
    entrypoint: ["/bin/sh", "/seaweedfs-init.sh"]
    volumes:
      - ./infra/seaweedfs/init.sh:/seaweedfs-init.sh:ro
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - keycloak
    profiles:
      - proxy

volumes:
  pgdata:
  redisdata:
  seaweedfsdata:
  mailpitdata:
  caddydata:
  caddyconfig:
