# Compliance ceilings for dependencies whose major version is constrained
# by a managed-service provider's adoption schedule. Bump entries here ONLY
# after the named provider publishes support for the new major; the
# `compliance-versions-gate` CI job (scripts/check-compliance-versions.sh)
# fails the build on any pinned image that exceeds the ceiling here.
#
# Why a manifest instead of `ignore` rules in dependabot.yml:
#   - One source of truth with rationale + revisit criteria, not scattered
#     YAML comments per ecosystem.
#   - CI gate catches manual edits, rebases, and any future bump source —
#     not just Dependabot PRs.
#   - Dependabot still opens major-bump PRs so CVE visibility is preserved;
#     the gate just blocks the merge.
#
# See ADR-026 for the cutover decision and the Scaleway-anchored versioning
# policy this manifest implements.

dependencies:
  postgres:
    max_major: 17
    provider: Scaleway Managed PostgreSQL EU
    # When this is satisfied, bump `max_major` and merge any pending
    # Dependabot PRs that previously failed the gate.
    revisit_criteria: |
      Scaleway publishes PG 18 GA support on
      https://www.scaleway.com/en/docs/managed-databases-for-postgresql-and-mysql/reference-content/pg-version-updates/
    pinned_in:
      - docker-compose.yml
      - config/deploy-staging.yml
      - .github/workflows/ci.yml

  redis:
    max_major: 8
    provider: Scaleway Managed Redis EU
    # Scaleway adopted Redis 8.4 in February 2026 and deprecated 7.2.11;
    # the `max_major` was bumped 7 → 8 in the same PR that cut over dev /
    # CI / staging to `redis:8`. Next revisit: when Scaleway publishes
    # Redis 9 GA support — at which point this manifest entry bumps,
    # the four `pinned_in:` files bump in lockstep, and ADR-026 gets a
    # third "cutover" subsection. Until then, Dependabot major-bump PRs
    # past Redis 8 are closed by the gate.
    revisit_criteria: |
      Scaleway publishes Redis 9 GA support in their Managed Redis docs.
    pinned_in:
      - docker-compose.yml
      - config/deploy-staging.yml
      - .github/workflows/ci.yml
