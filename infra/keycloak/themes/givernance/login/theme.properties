parent=keycloak
locales=en,fr

# Replace Keycloak's PatternFly stylesheet with the Givernance design system.
# All other keycloak-inherited templates (.ftl files not overridden here) will
# receive raw element styling from givernance.css rather than PatternFly classes.
styles=css/givernance.css

# Clear the static scripts inherited from the keycloak parent theme.
# The parent's js/login.js (and related PatternFly scripts) inject
# #input-error-{fieldname} spans with PatternFly classes alongside the
# field-error spans our FTL templates already render — causing double/
# inconsistent error display. Flow-specific scripts (WebAuthn, TOTP, etc.)
# are added dynamically by KC's flow processor via the FreeMarker `scripts`
# variable and are unaffected by this override.
scripts=

# Stable SPA login URL surfaced to FTL templates as `${properties.gvAppLoginUrl}`.
# Used by info.ftl to render a "Back to login" link after flows that
# consume the KC auth-session cookie (e.g. UPDATE_PASSWORD via
# `execute-actions-email`) — `${url.loginUrl}` is a /login-actions URL
# that requires the consumed cookie, so we point at the SPA instead.
# Dev value below; staging/prod override via per-env theme.
gvAppLoginUrl=http://localhost:3000/login
