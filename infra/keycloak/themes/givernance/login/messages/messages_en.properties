# Givernance — Keycloak login theme — English messages
# Overrides/extends the base keycloak messages_en.properties.

# Endonyms — each language written in its own language (used by the locale picker).
# Keycloak resolves l.label via the locale_<tag> key in the theme messages.
locale_en=English
locale_fr=Fran\u00e7ais

loginTitle=Sign in to {0}
loginAccountTitle=Sign in to your account
loginTotpTitle=Two-step verification
loginChooseAuthenticator=Choose authenticator
loginOtpTitle=One-time code
loginOtpOneTime=One-time code
# Device label shown above the OTP input so the operator remembers which
# authenticator they enrolled (issue #250 — PR #251 dev-feedback). Two
# keys to disambiguate the single-credential read-only label from the
# multi-credential active picker — same string today, distinct keys so
# we can localise them differently when adding more authenticator
# methods (security keys, push notifications, etc.).
loginOtpDeviceLabel=Authenticator
loginOtpDevicePickLabel=Choose authenticator
# Fallback when KC didn't surface a more specific message for the field
# (e.g. an unrecognised KC version routing the rejection through the
# global error stream). Most invalid-code paths populate
# `invalidTotpMessage` from KC's bundled bundle, which already says
# "Invalid authenticator code"; this extra key is just defence in depth.
invalidTotpMessage=Invalid authenticator code. Try again.
doLogIn=Sign in
doRegister=Create account
doForgotPassword=Forgot password?
doClickHere=click here
doSubmit=Submit
selectLocale=Language
showPassword=Show password
hidePassword=Hide password
showPasswordConfirm=Show password confirmation
hidePasswordConfirm=Hide password confirmation
doBack=Back
doCancel=Cancel
doTryAgain=Try again

email=Email address
password=Password
username=Username
usernameOrEmail=Email or username
rememberMe=Remember me

invalidUserMessage=Invalid email or password.
invalidPasswordMessage=Invalid email or password.
accountDisabledMessage=Your account is disabled. Please contact your administrator.
accountTemporarilyDisabledMessage=Your account is temporarily locked due to too many failed attempts. Please try again later or contact your administrator.
expiredCodeMessage=The code has expired. Please try again.
expiredActionMessage=The action has expired. Please start again.

emailForgotTitle=Forgot your password?
emailForgotInstruction=Enter your email address and we will send you a link to reset your password.
emailInstruction=Enter your email address.

updatePasswordTitle=Create new password
updatePasswordInstruction=Choose a strong password for your account.
passwordNew=New password
passwordConfirm=Confirm password
invalidPasswordConfirmMessage=Passwords do not match.
invalidPasswordMinLengthMessage=Password must be at least {0} characters.

emailVerifyTitle=Verify your email
emailVerifyInstruction1=An email has been sent to <strong>{0}</strong>.
emailVerifyInstruction2=Check your inbox and click the verification link.
emailVerifyInstruction3=Didn't receive the email? Check your spam folder or
emailVerifyInstruction3link=request a new link.

errorTitle=Something went wrong
backToLogin=Back to sign in

# Info page (post-action success — UPDATE_PASSWORD, etc.). The custom
# info.ftl renders this as the page heading; without it, FreeMarker
# emits the literal "infoTitle" because the parent KC theme doesn't
# define this key (PR #253 smoke-test feedback).
infoTitle=All set
proceedWithAction=Continue
# Fallback rendered when neither `client.baseUrl` nor
# `properties.gvAppLoginUrl` (theme.properties) provides an absolute
# URL — e.g. an environment whose theme.properties wasn't overridden
# at deploy time. Plain instructions beat a broken link.
backToLoginInstructions=You can now sign in to the Givernance application.

pageExpiredTitle=Session expired
pageExpiredMsg1=To continue, please
pageExpiredMsg2=or
pageExpiredMsg3=restart the login process.
